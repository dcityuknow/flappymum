<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no">
<title>Flappy Game</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<canvas id="gameCanvas"></canvas>
<div id="scoreBox">
  <img id="scoreIcon" src="assets/diem.png" alt="">
  <span id="scoreText">0</span>
</div>
<div id="playerTag">
  <img id="playerTagIcon" src="assets/nhanvat.png" alt="">
  <span id="playerTagName"></span>
</div>
<div id="msg">Tap or press Space to start</div>

<button id="leaderboardBtn">🏆 Leaderboard</button>
<button id="lobbyBtn">⬅ Lobby</button>

<!-- ---- Setup screen: enter name + choose character before playing ---- -->
<div id="setupOverlay" class="overlay">
  <div class="panel">
    <h1>🐤 Flappy Game</h1>
    <p class="subtitle">Enter your name and pick a character to start</p>

    <input id="playerNameInput" type="text" maxlength="20" placeholder="Enter your name" autocomplete="off">

    <div class="char-select">
      <div class="char-option" data-char="1">
        <img src="assets/nhanvat.png" alt="Keng">
        <span>Keng</span>
      </div>
      <div class="char-option" data-char="2">
        <img src="assets/nhanvat2.png" alt="Scotti">
        <span>Scotti</span>
      </div>
    </div>

    <button id="startBtn" class="btn-primary" disabled>Start Game</button>
    <button id="openLeaderboardFromSetupBtn" class="btn-secondary">🏆 View Leaderboard</button>
  </div>
</div>

<!-- ---- Leaderboard screen ---- -->
<div id="leaderboardOverlay" class="overlay hidden">
  <div class="panel">
    <h2>🏆 Leaderboard</h2>
    <ol id="leaderboardList"></ol>
    <button id="closeLeaderboardBtn" class="btn-primary">Close</button>
    <button id="lobbyFromLeaderboardBtn" class="btn-secondary">⬅ Back to Lobby</button>
  </div>
</div>

<!-- Scripts load in dependency order (classic scripts share one global scope,
     so no bundler/module setup is needed - just keep this order). -->
<script src="js/dom.js"></script>
<script src="js/effects.js"></script>
<script src="js/audio.js"></script>
<script src="js/sprites.js"></script>
<script src="js/config.js"></script>
<script src="js/state.js"></script>
<script src="js/leaderboard.js"></script>
<script src="js/lobby.js"></script>
<script src="js/game.js"></script>
<script src="js/main.js"></script>

</body>
</html>
